# Name of your workflow
name: Build and Push API Gateway to Docker Hub

# Triggers the workflow on pushes to the "main" branch
on:
  push:
    branches:
      - "main" # Change this if your default branch is "master"

jobs:
  build-and-push:
    # Runs the job on a GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up Docker Buildx for better building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Logs in to Docker Hub using your secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Builds your Dockerfile and pushes it to Docker Hub
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: . # Use the current directory for the build
          file: ./Dockerfile
          push: true # This tells it to push after building
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}